name: Android pull request validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-android:
    name: Android lint, tests and compile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-lint" --stacktrace

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-test" --stacktrace

      - name: Compile debug APK
        run: ./gradlew assembleDebug -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-assemble" --stacktrace
