name: Build downloadable APK

on:
  push:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cyberquiz-apk-release
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CYBERQUIZ_CONTACT_API_URL: https://cyberquiz-api.onrender.com/api/contact
    outputs:
      version_code: ${{ steps.release_meta.outputs.version_code }}
      version_name: ${{ steps.release_meta.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Validate contact API configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CYBERQUIZ_CONTACT_API_URL" || "$CYBERQUIZ_CONTACT_API_URL" != https://* ]]; then
            echo "::error::CyberQuiz contact API URL must be HTTPS before publishing."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "CYBERQUIZ_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate bundled update history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/runs?status=success&per_page=100" > "$RUNNER_TEMP/cyberquiz-build-runs.json"
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          asset = Path("app/src/main/assets/update_history.json")
          seed = []
          if asset.exists():
              try:
                  seed = json.loads(asset.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  seed = []

          by_version = {
              item.get("version"): item
              for item in seed
              if isinstance(item, dict) and item.get("version")
          }

          months = [
              "janvier", "février", "mars", "avril", "mai", "juin",
              "juillet", "août", "septembre", "octobre", "novembre", "décembre"
          ]

          def french_date(value: str) -> str:
              try:
                  parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
                  return f"{parsed.day} {months[parsed.month - 1]} {parsed.year}"
              except Exception:
                  return "Date inconnue"

          def clean_changes(message: str):
              message = (message or "").strip()
              if not message:
                  return ["Mise à jour technique de CyberQuiz."]
              paragraphs = [re.sub(r"\s+", " ", p).strip() for p in re.split(r"\n\s*\n", message) if p.strip()]
              changes = []
              for index, paragraph in enumerate(paragraphs[:4]):
                  if paragraph.lower().startswith("co-authored-by:"):
                      continue
                  if index == 0:
                      paragraph = re.sub(r"\s*\(#\d+\)\s*$", "", paragraph)
                  if paragraph and paragraph not in changes:
                      changes.append(paragraph)
              return changes or ["Mise à jour technique de CyberQuiz."]

          runs = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("cyberquiz-build-runs.json").read_text(encoding="utf-8"))
          for run in runs.get("workflow_runs", []):
              number = int(run.get("run_number") or 0)
              if number <= 0:
                  continue
              version = f"1.0.{number}"
              if version in by_version:
                  continue
              head_commit = run.get("head_commit") or {}
              by_version[version] = {
                  "version": version,
                  "date": french_date(run.get("created_at", "")),
                  "changes": clean_changes(head_commit.get("message", "")),
              }

          current_version = os.environ["CYBERQUIZ_VERSION_NAME"]
          current_message = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%B", os.environ["GITHUB_SHA"]],
              text=True,
          )
          by_version[current_version] = {
              "version": current_version,
              "date": french_date(dt.datetime.now(dt.timezone.utc).isoformat()),
              "changes": clean_changes(current_message),
          }

          def version_number(item):
              try:
                  return int(item["version"].rsplit(".", 1)[1])
              except Exception:
                  return -1

          history = sorted(by_version.values(), key=version_number, reverse=True)
          asset.write_text(json.dumps(history, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Generated {len(history)} update history entries; current={current_version}")
          PY

      - name: Run Android release lint
        run: |
          ./gradlew lintRelease \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-release" \
            --stacktrace

      - name: Run Android unit tests
        run: |
          ./gradlew testDebugUnitTest \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-debug" \
            --stacktrace

      - name: Build unsigned release APK
        run: |
          ./gradlew assembleRelease \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-assemble" \
            --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CyberQuiz-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 1

  sign-apk:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      actions: read
    outputs:
      signing_mode: ${{ steps.sign_meta.outputs.signing_mode }}

    steps:
      - name: Download unsigned build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: CyberQuiz-unsigned
          path: unsigned-artifact

      - name: Align, sign and verify APK
        id: sign_meta
        shell: bash
        env:
          CYBERQUIZ_EXISTING_KEYSTORE_BASE64: ${{ secrets.CYBERQUIZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          EXPECTED_PACKAGE="com.elikto.cyberquiz"
          EXPECTED_SIGNER_SHA256="2de78206305bac6f95b631b0cf5f8eebc2bcba583fdf93544ead1cefa9d031a2"

          if [ -z "$CYBERQUIZ_EXISTING_KEYSTORE_BASE64" ]; then
            echo "::error::The existing CyberQuiz signing key is required to preserve Android update compatibility."
            exit 1
          fi

          UNSIGNED_APK="$(find unsigned-artifact -type f -name 'app-release-unsigned.apk' -print -quit)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned release APK not found."
            exit 1
          fi

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "::error::Android packaging/signing tools are unavailable on the runner."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/cyberquiz-existing.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$CYBERQUIZ_EXISTING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" CyberQuiz-aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out CyberQuiz.apk \
            CyberQuiz-aligned.apk
          rm -f CyberQuiz-aligned.apk

          PACKAGE_NAME="$("$AAPT" dump badging CyberQuiz.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ "$PACKAGE_NAME" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Android package mismatch. Expected $EXPECTED_PACKAGE but got ${PACKAGE_NAME:-unknown}."
            rm -f CyberQuiz.apk
            exit 1
          fi

          SIGNER_REPORT="$("$APKSIGNER" verify --verbose --print-certs CyberQuiz.apk)"
          printf '%s\n' "$SIGNER_REPORT"
          ACTUAL_SIGNER_SHA256="$(printf '%s\n' "$SIGNER_REPORT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Android signer identity mismatch. Expected $EXPECTED_SIGNER_SHA256 but got ${ACTUAL_SIGNER_SHA256:-unknown}."
            rm -f CyberQuiz.apk
            exit 1
          fi

          echo "signing_mode=existing-key-isolated-and-pinned" >> "$GITHUB_OUTPUT"

      - name: Prepare signed update metadata
        env:
          VERSION_CODE: ${{ needs.build-apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.build-apk.outputs.version_name }}
        run: |
          APK_SHA256="$(sha256sum CyberQuiz.apk | awk '{print $1}')"
          cat > update.json <<EOF
          {
            "packageName": "com.elikto.cyberquiz",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/Elikto/CyberQuiz/releases/download/apk-latest/CyberQuiz.apk",
            "sha256": "${APK_SHA256}",
            "updateReady": true
          }
          EOF

      - name: Upload validated signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CyberQuiz-APK
          path: |
            CyberQuiz.apk
            update.json
            unsigned-artifact/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30

  publish-apk:
    runs-on: ubuntu-latest
    needs:
      - build-apk
      - sign-apk
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download validated APK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: CyberQuiz-APK
          path: release-artifact

      - name: Publish latest APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Elikto/CyberQuiz
          VERSION_NAME: ${{ needs.build-apk.outputs.version_name }}
          SIGNING_MODE: ${{ needs.sign-apk.outputs.signing_mode }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          NOTES="APK Android Release généré automatiquement depuis main. Version ${VERSION_NAME}. Package com.elikto.cyberquiz. Commit source ${SOURCE_SHA}. Lint Android et tests unitaires validés avant signature. La clé privée de distribution est isolée du build Gradle, puis l'APK est aligné, signé et vérifié avec apksigner. L'empreinte SHA-256 du certificat Android attendu est épinglée. Identité de signature: ${SIGNING_MODE}."

          if ! gh release view apk-latest >/dev/null 2>&1; then
            echo "::error::The stable apk-latest GitHub Release is missing. Create it once before automated asset updates."
            exit 1
          fi

          gh release edit apk-latest \
            --title "CyberQuiz APK - dernière version" \
            --notes "$NOTES" \
            --latest

          gh release upload apk-latest \
            release-artifact/CyberQuiz.apk \
            release-artifact/update.json \
            --clobber
