name: Build downloadable APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberquiz-apk-release
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CYBERQUIZ_DEBUG_KEYSTORE_BASE64: ${{ secrets.CYBERQUIZ_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare version and signing
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "CYBERQUIZ_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          if [ -z "$CYBERQUIZ_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::CYBERQUIZ_DEBUG_KEYSTORE_BASE64 is required for secure signed releases."
            exit 1
          fi

          echo "$CYBERQUIZ_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyberquiz-update.keystore"
          chmod 600 "$RUNNER_TEMP/cyberquiz-update.keystore"
          echo "CYBERQUIZ_KEYSTORE_PATH=$RUNNER_TEMP/cyberquiz-update.keystore" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run Android security-quality checks
        run: |
          ./gradlew lintRelease testDebugUnitTest \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            --stacktrace

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            --stacktrace

      - name: Prepare downloadable APK and signed metadata
        run: |
          cp app/build/outputs/apk/release/app-release.apk CyberQuiz.apk
          APK_SHA256="$(sha256sum CyberQuiz.apk | awk '{print $1}')"

          cat > update.json <<EOF
          {
            "packageName": "com.example.cyberquiz",
            "versionCode": ${CYBERQUIZ_VERSION_CODE},
            "versionName": "${CYBERQUIZ_VERSION_NAME}",
            "apkUrl": "https://github.com/Elikto/CyberQuiz/releases/download/apk-latest/CyberQuiz.apk",
            "sha256": "${APK_SHA256}",
            "updateReady": true
          }
          EOF

      - name: Upload APK and metadata as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: CyberQuiz-APK
          path: |
            CyberQuiz.apk
            update.json
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f apk-latest "$GITHUB_SHA"
          git push origin refs/tags/apk-latest --force

          NOTES="APK Android Release signé généré automatiquement depuis main. Version ${CYBERQUIZ_VERSION_NAME}. Lint Android et tests unitaires validés. Mise à jour vérifiée par SHA-256 et signature Android."

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest \
              --title "CyberQuiz APK - dernière version" \
              --notes "$NOTES" \
              --latest
          else
            gh release create apk-latest \
              --title "CyberQuiz APK - dernière version" \
              --notes "$NOTES" \
              --latest
          fi

          gh release upload apk-latest CyberQuiz.apk update.json --clobber
