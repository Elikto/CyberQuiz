name: Build downloadable APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cyberquiz-apk-release
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.release_meta.outputs.version_name }}
      signing_mode: ${{ steps.release_meta.outputs.signing_mode }}
    env:
      CYBERQUIZ_EXISTING_KEYSTORE_BASE64: ${{ secrets.CYBERQUIZ_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare version and signing
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "CYBERQUIZ_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          if [ -z "$CYBERQUIZ_EXISTING_KEYSTORE_BASE64" ]; then
            echo "::error::The existing CyberQuiz signing key is required to preserve Android update compatibility."
            exit 1
          fi

          echo "::notice::Keeping the existing signing identity intentionally. Do not replace it with an unrelated key without an Android signing-key rotation plan."
          echo "$CYBERQUIZ_EXISTING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyberquiz-existing.keystore"
          chmod 600 "$RUNNER_TEMP/cyberquiz-existing.keystore"
          echo "CYBERQUIZ_KEYSTORE_PATH=$RUNNER_TEMP/cyberquiz-existing.keystore" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "CYBERQUIZ_SIGNING_MODE=existing-key" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "signing_mode=existing-key" >> "$GITHUB_OUTPUT"

      - name: Run Android release lint
        run: |
          ./gradlew lintRelease \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-release" \
            --stacktrace

      - name: Run Android unit tests
        run: |
          ./gradlew testDebugUnitTest \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-debug" \
            --stacktrace

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PcyberVersionCode="$CYBERQUIZ_VERSION_CODE" \
            -PcyberVersionName="$CYBERQUIZ_VERSION_NAME" \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-assemble" \
            --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner is unavailable on the runner."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare downloadable APK and signed metadata
        run: |
          cp app/build/outputs/apk/release/app-release.apk CyberQuiz.apk
          APK_SHA256="$(sha256sum CyberQuiz.apk | awk '{print $1}')"

          cat > update.json <<EOF
          {
            "packageName": "com.example.cyberquiz",
            "versionCode": ${CYBERQUIZ_VERSION_CODE},
            "versionName": "${CYBERQUIZ_VERSION_NAME}",
            "apkUrl": "https://github.com/Elikto/CyberQuiz/releases/download/apk-latest/CyberQuiz.apk",
            "sha256": "${APK_SHA256}",
            "updateReady": true
          }
          EOF

      - name: Upload APK and metadata as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CyberQuiz-APK
          path: |
            CyberQuiz.apk
            update.json
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30

  publish-apk:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository for release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download validated APK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: CyberQuiz-APK
          path: release-artifact

      - name: Publish latest APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build-apk.outputs.version_name }}
          SIGNING_MODE: ${{ needs.build-apk.outputs.signing_mode }}
        run: |
          git tag -f apk-latest "$GITHUB_SHA"
          git push origin refs/tags/apk-latest --force

          NOTES="APK Android Release signé généré automatiquement depuis main. Version ${VERSION_NAME}. Lint Android, tests unitaires et vérification de signature APK validés. Mise à jour vérifiée par SHA-256 et signature Android. Identité de signature conservée pour compatibilité des mises à jour: ${SIGNING_MODE}."

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest \
              --title "CyberQuiz APK - dernière version" \
              --notes "$NOTES" \
              --latest
          else
            gh release create apk-latest \
              --title "CyberQuiz APK - dernière version" \
              --notes "$NOTES" \
              --latest
          fi

          gh release upload apk-latest \
            release-artifact/CyberQuiz.apk \
            release-artifact/update.json \
            --clobber
