name: Android Room migration tests

on:
  push:
    branches:
      - main
    paths:
      - "app/src/main/java/com/example/cyberquiz/data/database/**"
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-migration-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/src/main/java/com/example/cyberquiz/data/database/**"
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-migration-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room-migrations:
    name: Room migration 1 to 6
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this GitHub-hosted runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run Room migration tests on Android API 30 x86_64
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew pixel2api30DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-migration-test" \
            --stacktrace

      - name: Upload migration test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CyberQuiz-Room-migration-test-report
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
