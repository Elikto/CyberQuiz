name: Build Android developer registration APK

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cyberquiz-android-developer-registration
  cancel-in-progress: true

jobs:
  build-registration-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Inject Android Developer Console registration proof
        shell: bash
        env:
          ADI_REGISTRATION_PROPERTIES_BASE64: ${{ secrets.CYBERQUIZ_ADI_REGISTRATION_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ADI_REGISTRATION_PROPERTIES_BASE64" ]; then
            echo "::error::Missing CYBERQUIZ_ADI_REGISTRATION_PROPERTIES_BASE64. Add the Base64-encoded adi-registration.properties content provided by Android Developer Console as a repository secret."
            exit 1
          fi

          mkdir -p app/src/main/assets
          printf '%s' "$ADI_REGISTRATION_PROPERTIES_BASE64" | base64 --decode > app/src/main/assets/adi-registration.properties
          chmod 600 app/src/main/assets/adi-registration.properties

          if [ ! -s app/src/main/assets/adi-registration.properties ]; then
            echo "::error::The generated adi-registration.properties file is empty."
            exit 1
          fi

      - name: Build unsigned registration APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((900000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="registration.${GITHUB_RUN_NUMBER}"

          ./gradlew assembleRelease \
            -PcyberVersionCode="$VERSION_CODE" \
            -PcyberVersionName="$VERSION_NAME" \
            -ProomSchemaLocation="$RUNNER_TEMP/room-schemas-registration" \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          if ! unzip -l "$APK" | grep -q 'assets/adi-registration.properties'; then
            echo "::error::Registration proof was not embedded in the APK."
            exit 1
          fi

      - name: Upload unsigned registration APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CyberQuiz-registration-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign-registration-apk:
    runs-on: ubuntu-latest
    needs: build-registration-apk
    permissions:
      actions: read

    steps:
      - name: Download unsigned registration APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: CyberQuiz-registration-unsigned
          path: unsigned-registration

      - name: Align, sign and verify registration APK
        shell: bash
        env:
          CYBERQUIZ_EXISTING_KEYSTORE_BASE64: ${{ secrets.CYBERQUIZ_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          EXPECTED_SIGNER_SHA256="2de78206305bac6f95b631b0cf5f8eebc2bcba583fdf93544ead1cefa9d031a2"

          if [ -z "$CYBERQUIZ_EXISTING_KEYSTORE_BASE64" ]; then
            echo "::error::The existing CyberQuiz signing key is required to prove ownership of com.example.cyberquiz."
            exit 1
          fi

          UNSIGNED_APK="$(find unsigned-registration -type f -name 'app-release-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED_APK"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"

          KEYSTORE="$RUNNER_TEMP/cyberquiz-existing.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$CYBERQUIZ_EXISTING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" CyberQuiz-registration-aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out CyberQuiz-android-developer-registration.apk \
            CyberQuiz-registration-aligned.apk
          rm -f CyberQuiz-registration-aligned.apk

          SIGNER_REPORT="$("$APKSIGNER" verify --verbose --print-certs CyberQuiz-android-developer-registration.apk)"
          printf '%s\n' "$SIGNER_REPORT"
          ACTUAL_SIGNER_SHA256="$(printf '%s\n' "$SIGNER_REPORT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"

          if [ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Signer mismatch. Expected $EXPECTED_SIGNER_SHA256 but got ${ACTUAL_SIGNER_SHA256:-unknown}."
            rm -f CyberQuiz-android-developer-registration.apk
            exit 1
          fi

          if ! unzip -l CyberQuiz-android-developer-registration.apk | grep -q 'assets/adi-registration.properties'; then
            echo "::error::Registration proof is missing from the signed APK."
            exit 1
          fi

      - name: Upload registration APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CyberQuiz-Android-Developer-Registration
          path: CyberQuiz-android-developer-registration.apk
          if-no-files-found: error
          retention-days: 7
