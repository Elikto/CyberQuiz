name: Deploy CyberQuiz PWA

on:
  push:
    branches:
      - main
    paths:
      - "pwa/**"
      - "app/src/main/java/com/example/cyberquiz/data/repository/QuizRepository.kt"
      - "app/src/main/java/com/example/cyberquiz/data/repository/CyberQuestionExpansion.kt"
      - "app/src/main/res/drawable-nodpi/cyberquiz_app_icon.jpg"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cyberquiz-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate PWA question bank from Android Cyber questions
        run: python3 pwa/build_questions.py pwa/questions.json

      - name: Copy CyberQuiz icon
        run: cp app/src/main/res/drawable-nodpi/cyberquiz_app_icon.jpg pwa/icon.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
