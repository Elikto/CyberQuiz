services:
  - type: web
    name: cyberquiz-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CYBERQUIZ_CONTACT_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: CYBERQUIZ_CONTACT_INBOX_SEGMENT_ID
        value: 055977c4-cf9e-4cbe-9d6b-d1350e24dbf2
      - key: CYBERQUIZ_CONTACT_FROM
        sync: false
      - key: CYBERQUIZ_CONTACT_TO
        value: elikto@proton.me
      - key: CYBERQUIZ_ENABLE_GENERATION
        value: "false"
