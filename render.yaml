services:
  - type: web
    name: cyberquiz-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: uvicorn app.entry:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CYBERQUIZ_CONTACT_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: CYBERQUIZ_CONTACT_INBOX_SEGMENT_ID
        value: 87c1f5cc-24dc-473e-a17f-8b3be9c076ea
      - key: CYBERQUIZ_CONTACT_FROM
        sync: false
      - key: CYBERQUIZ_CONTACT_TO
        value: elikto@proton.me
      - key: CYBERQUIZ_URGENT_TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CYBERQUIZ_URGENT_TELEGRAM_CHAT_ID
        sync: false
      - key: CYBERQUIZ_ENABLE_GENERATION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CYBERQUIZ_AUTH_JWT_SECRET
        sync: false
      - key: CYBERQUIZ_GOOGLE_CLIENT_ID
        sync: false
