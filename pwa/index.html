<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020611">
  <meta name="description" content="CyberQuiz — quiz de cybersécurité installable sur iPhone et Android.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CyberQuiz">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.jpg">
  <link rel="icon" href="./icon.jpg">
  <link rel="stylesheet" href="./styles.css">
  <title>CyberQuiz</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="homeButton" type="button" aria-label="Accueil">⌂</button>
      <div class="brand">
        <span class="brand-mark">?</span>
        <div>
          <strong>CYBERQUIZ</strong>
          <small>CYBERSÉCURITÉ</small>
        </div>
      </div>
      <button class="icon-button" id="statsButton" type="button" aria-label="Statistiques">⌁</button>
    </header>

    <main id="app" aria-live="polite">
      <section class="screen loading-screen">
        <div class="spinner"></div>
        <p>Chargement de CyberQuiz…</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button data-nav="home" class="active"><span>⌂</span><small>Accueil</small></button>
      <button data-nav="quiz"><span>▶</span><small>Quiz</small></button>
      <button data-nav="stats"><span>⌁</span><small>Stats</small></button>
      <button data-nav="history"><span>◷</span><small>Historique</small></button>
    </nav>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
